<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알뜰시장 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#FFF6D6;--card:#fff;--ink:#3a2e5a;--sub:#7a6f99;--line:#e6dcc0;--yellow:#FFD23F;--coral:#FF6B81;--mint:#2EC4A6;--sky:#4D9BFF;--grape:#9B6BFF;--orange:#FF9F43;--dot:#ffe9a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2447;--card:#3a3362;--ink:#fff4d6;--sub:#c9bfee;--line:#5a5290;--dot:#352d5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2447;--card:#3a3362;--ink:#fff4d6;--sub:#c9bfee;--line:#5a5290;--dot:#352d5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:26px 26px;font-size:18px;line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{margin:6px 0 2px;font-size:30px;letter-spacing:-.5px}
h1 span{display:inline-block}
.hero{text-align:center;padding:8px 0 4px}
.hero p{margin:0;color:var(--sub)}
.card{background:var(--card);border-radius:26px;padding:18px;margin:14px 0;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.card h2{margin:0 0 10px;font-size:22px}
label{display:block;font-size:16px;color:var(--sub);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grades button{padding:12px 0;font-size:22px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer}
.grades button.on{background:var(--yellow);color:#3a2e5a;transform:translateY(-3px);box-shadow:0 4px 0 var(--ink)}
.grades.c3{grid-template-columns:repeat(3,1fr)}
.btn{font:inherit;font-size:21px;border:3px solid var(--ink);border-radius:20px;padding:12px 18px;cursor:pointer;color:#fff;box-shadow:0 5px 0 var(--ink);width:100%;margin-top:14px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.b-sky{background:var(--sky)}.b-coral{background:var(--coral)}.b-mint{background:var(--mint)}.b-grape{background:var(--grape)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;font-size:16px;padding:8px;margin-top:10px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;padding:8px 0;background:var(--bg)}
nav button{flex:1;font:inherit;font-size:17px;padding:10px 4px;border-radius:18px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
nav button.on{color:#fff;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
nav button[data-t=sell].on{background:var(--coral)}nav button[data-t=buy].on{background:var(--sky)}nav button[data-t=sum].on{background:var(--mint)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who{font-size:18px}.who b{font-size:20px}
.pig{cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--yellow);color:#3a2e5a;border:3px solid var(--ink);border-radius:22px;padding:8px 14px}
.pig .big{font-size:26px;font-weight:700;line-height:1.1}
.pig small{display:block;font-size:13px}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.tag{position:relative;background:#fff;color:#3a2e5a;border:3px solid #3a2e5a;border-radius:6px 18px 18px 6px;padding:14px 12px 12px 26px;clip-path:polygon(0 0,86% 0,100% 18%,100% 100%,0 100%)}
.tag::before{content:"";position:absolute;left:9px;top:12px;width:11px;height:11px;border-radius:50%;border:3px solid #3a2e5a;background:var(--bg)}
.tag .nm{font-size:19px;word-break:keep-all;margin-top:10px}
.tag .pr{font-size:26px;font-weight:700;color:var(--coral)}
.tag .ct{font-size:14px;color:#7a6f99}
.tag .x,.rc .x{position:absolute;right:6px;bottom:4px;border:0;background:none;font-size:20px;cursor:pointer}
.tag.out{background:#dcdcdc!important;color:#8a8a8a;border-color:#8a8a8a;filter:grayscale(1)}.tag.out .pr,.tag.out .ct{color:#8a8a8a}
.c0{background:#FFE3E8}.c1{background:#DDF3FF}.c2{background:#E4F9D8}.c3{background:#FFF0C2}.c4{background:#ECE0FF}
.rcs{margin-top:12px;background:#fff;color:#3a2e5a;border:3px solid #3a2e5a;padding:12px 14px 22px;border-radius:12px 12px 0 0;position:relative;font-family:'Gowun Dodum',monospace}
.rcs::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-14px;height:14px;background:linear-gradient(-45deg,transparent 8px,#fff 0) 0 0/16px 14px,linear-gradient(45deg,transparent 8px,#fff 0) 0 0/16px 14px;filter:drop-shadow(0 3px 0 #3a2e5a)}
.rcs h3{margin:0 0 6px;text-align:center;border-bottom:3px dashed #3a2e5a;padding-bottom:6px;font-size:20px}
.rc{display:flex;justify-content:space-between;gap:8px;padding:7px 28px 7px 0;border-bottom:2px dotted #c9bfee;position:relative}
.rc .x{right:0;bottom:6px}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding-top:10px}
.empty{text-align:center;color:var(--sub);padding:18px 0}
.warn{background:#FFE3E8;color:#8a1030;border:3px solid var(--coral);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:16px}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:3px dotted var(--line);font-size:20px}
.sumline.final{border:0;font-size:26px;font-weight:700}
.ev{margin:10px 0 16px}
.ev p{margin:0 0 6px}
.lv{display:flex;gap:6px}
.lv button{flex:1;font:inherit;font-size:15px;padding:8px 2px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.lv button.on{border-color:var(--ink);background:var(--yellow);color:#3a2e5a;font-weight:700}
.lv button i{display:block;font-style:normal;font-size:24px}
.msg{text-align:center;font-size:20px;padding:12px;border-radius:18px;background:#E4F9D8;color:#1f5a2a;border:3px solid var(--mint);margin-top:10px}
.sign{display:flex;align-items:center;gap:10px;font-size:18px}
.sign input{width:28px;height:28px}
.pop{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:30px;font-size:20px;z-index:20;animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,16px) scale(.8);opacity:0}}
.sec{display:none}.sec.on{display:block}
.npc{text-align:center}.who2{display:flex;justify-content:center;align-items:center;gap:8px}.crest{height:34px;width:auto;border-radius:8px;border:2px solid var(--ink);background:#fff}.npc .av{font-size:68px;display:block;line-height:1.1}.stars{font-size:26px;letter-spacing:4px;margin-bottom:6px}
.bubble{background:#FFF0C2;color:#3a2e5a;border:3px solid var(--ink);border-radius:22px;padding:16px;margin:12px 0;text-align:left;animation:bub .3s ease-out}.bubble .big{font-size:58px;text-align:center;line-height:1.2}.bubble h2{margin:4px 0 6px;font-size:23px}.bubble p{margin:6px 0}.qt{color:#7a45e0;font-weight:700}
@keyframes bub{from{transform:scale(.92);opacity:0}}@media (prefers-reduced-motion:reduce){.bubble{animation:none}}
.ovl{position:fixed;inset:0;overflow:auto;background:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:26px 26px;z-index:25;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media print{.ovl{display:none!important}}
.pr-only{display:none}
.seg{display:flex;gap:6px;margin-bottom:6px}.seg span,.seg button{font:inherit;cursor:pointer;background:var(--card);flex:1;text-align:center;font-size:15px;padding:8px 2px;border-radius:14px;border:3px solid var(--line);color:var(--sub)}.seg span.on,.seg button.on{background:var(--coral);border-color:var(--ink);color:#fff;font-weight:700}
.sb{display:flex;gap:6px;margin:8px 0 22px}.sb button{font:inherit;font-size:16px;border:3px solid #3a2e5a;border-radius:12px;background:#fff;color:#3a2e5a;cursor:pointer;padding:6px 8px}.sb .plus{flex:1;background:var(--mint);color:#fff}
.ring{width:160px;height:160px;border-radius:50%;margin:14px auto;display:grid;place-items:center;background:conic-gradient(var(--coral) calc(var(--p)*1%),var(--line) 0);border:3px solid var(--ink)}.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}.ring b{font-size:36px;line-height:1}.ring small{font-size:14px;color:var(--sub)}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{border-bottom:2px dotted var(--line);padding:6px 5px;text-align:center;white-space:nowrap}.tb th{color:var(--sub);font-weight:400}
nav button[data-t=tch].on{background:var(--grape)}
.mini{font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);padding:4px 8px;cursor:pointer;margin:4px 0}
.rpt{position:fixed;inset:0;overflow:auto;background:#fff;color:#222;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:30}.rpt .tb th{color:#555}.rpt .tb td,.rpt .tb th{border-bottom:2px solid #ddd}.rp{max-width:210mm;margin:0 auto 30px;background:#fff;padding:10mm;box-shadow:0 0 8px rgba(0,0,0,.25)}.rp h2{margin:0 0 6px}.rp h3{margin:14px 0 4px}.rp p{margin:4px 0}.qrw{text-align:center;margin-top:14px}.qrw img{width:33vw;min-width:200px;max-width:100%;height:auto;background:#fff;padding:10px;border-radius:16px;border:3px solid var(--ink)}.qrw p{margin:8px 0 0;color:var(--sub);font-size:16px}
.sgn{margin-top:16px;display:flex;justify-content:flex-end;break-inside:avoid}.sgbox{width:24mm;border:2px solid #333}.sgbox span{display:block;text-align:center;background:#f3f3f3;border-bottom:2px solid #333;font-size:12px;line-height:1.3;padding:2px 0}.sgbox .stamp{height:24mm}.rbar{max-width:720px;margin:0 auto 10px}
@page{size:A4;margin:12mm}
@media print{body.hasrpt .wrap{display:none!important}.rpt{position:static;overflow:visible;padding:0}.rp{break-after:page;margin:0;padding:0;box-shadow:none;max-width:none}.rp:last-child{break-after:auto}.rpt .tb{font-size:12px}.rp,.rp p{font-size:13px}.rp h2{font-size:22px}.rp h3{font-size:16px}}
@media print{.sec.tch{display:none!important}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media print{body{background:#fff;color:#000;font-size:14px}nav,.btn,.x,.noprint,#addS,#addB{display:none!important}.sec{display:block!important}.card{box-shadow:none;break-inside:avoid}.pr-only{display:block}.wrap{padding:0}.pig{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var KEY='altteul-sijang-v1';
var S={p:null,sells:[],buys:[],eS:[-1,-1,-1],eB:[-1,-1,-1],sign:false,left:'',tab:'sell'};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
// ===== Firebase 설정 =====
var FB_CONFIG={apiKey:"AIzaSyDZX-mOBNN_7lUvOTMoCOf9uZt8Wf3M4bQ",authDomain:"market2026-1e139.firebaseapp.com",projectId:"market2026-1e139",storageBucket:"market2026-1e139.firebasestorage.app",messagingSenderId:"455248750457",appId:"1:455248750457:web:f73d54cd6130d8ed40f1a8"};
var CLS=['강','들','산'],DB=null,ROWS=[],UID=null;
try{UID=localStorage.getItem('altteul-uid');if(!UID){UID=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('altteul-uid',UID);}}catch(e){UID=Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
try{if(window.firebase&&FB_CONFIG.projectId){firebase.initializeApp(FB_CONFIG);DB=firebase.firestore();}}catch(e){DB=null;}
if(!S.phase)S.phase='prep';
S.sells=S.sells.map(function(x){if(x.sold===undefined)x.sold=x.qty;return x;});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function won(n){return Number(n||0).toLocaleString('ko-KR')+'원';}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function sum(a,f){return a.reduce(function(t,x){return t+f(x);},0);}
function totalS(){return sum(S.sells,function(x){return x.price*x.sold;});}
function stockN(){return sum(S.sells,function(x){return x.qty;});}
function soldN(){return sum(S.sells,function(x){return x.sold;});}
function pct(){var s=stockN();return s?Math.round(soldN()/s*100):0;}
function totalB(){return sum(S.buys,function(x){return x.price;});}
function leftNow(){return S.p.start+totalS()-totalB();}
function toast(t){var d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},1600);}
var app=document.getElementById('app');
var EVS=[['알뜰시장에 필요한 준비물을 빠짐없이 준비했나요?','물건을 판매 방법에 맞게 잘 판매하였나요?','가게 놀이 활동 후 주변 정리를 잘하였나요?'],['나에게 꼭 필요한 물건만 구매하였나요?','합리적으로 저렴한 가격에 물건을 구입하였나요?','가게 놀이 활동 후 주변 정리를 잘하였나요?']];
var LV=[['😍','참 잘했어요'],['🙂','잘했어요'],['💪','노력이 필요해요']];

function clsFor(g){return g<=3?CLS.slice(0,2):CLS;}
function pick(id,list,cur,fn,suf){var el=document.getElementById(id);function d(){el.innerHTML='';list.forEach(function(v){var b=document.createElement('button');b.textContent=v+(suf||'');if(v===cur)b.className='on';b.onclick=function(){cur=v;fn(v);d();};el.appendChild(b);});}d();}
function home(){
  if(TUNSUB){TUNSUB();TUNSUB=null;}
  app.innerHTML='<div class="hero"><h1>🛍️ 알뜰시장 장부</h1><p>가격표와 영수증을 내 손안에 모아요!</p></div><div class="card"><h2>누구로 시작할까요?</h2><button class="btn b-coral" id="rs">🎒 학생으로 시작하기</button><button class="btn b-grape" id="rt">👩‍🏫 교사로 시작하기</button><button class="btn b-sky" id="rq">📱 접속 QR코드 보여주기</button><div id="qrbox"></div></div>';
  document.getElementById('rs').onclick=function(){if(S.p)main();else if(!seen)intro();else setup();};
  document.getElementById('rt').onclick=tLogin;
  var qs=false;document.getElementById('rq').onclick=function(){qs=!qs;document.getElementById('qrbox').innerHTML=qs?'<div class="qrw"><img src="'+QRIMG+'" alt="접속 QR코드"><p>카메라로 찍어서 접속해요</p></div>':'';this.textContent=qs?'❌ QR코드 닫기':'📱 접속 QR코드 보여주기';};
}
function setup(){
  var g=S.p?S.p.grade:3,c=S.p?S.p.cls:'';
  app.innerHTML='<div class="hero"><h1>🛍️ 알뜰시장 장부</h1><p>가격표와 영수증을 내 손안에 모아요!</p></div>'+
  '<div class="card"><h2>👋 나를 알려주세요</h2><label>학년</label><div class="grades" id="gr"></div><label>반</label><div class="grades c3" id="cr"></div>'+
  '<label>번호</label><input id="num" type="number" inputmode="numeric" min="1" placeholder="예: 7">'+
  '<label>이름</label><input id="nm" placeholder="내 이름" maxlength="10">'+
  '<label>처음 가지고 있던 돈 (원)</label><input id="st" type="number" inputmode="numeric" min="0" step="100" placeholder="예: 3000">'+
  '<div id="err"></div><button class="btn b-coral" id="go">🚀 시작하기</button><button class="btn ghost" id="hm">← 처음으로</button></div>';
  if(S.p){document.getElementById('num').value=S.p.num;document.getElementById('nm').value=S.p.name;document.getElementById('st').value=S.p.start;}
  function drawC(){if(clsFor(g).indexOf(c)<0)c='';pick('cr',clsFor(g),c,function(v){c=v;},'반');}
  pick('gr',[1,2,3,4,5,6],g,function(v){g=v;drawC();},'');
  drawC();
  document.getElementById('hm').onclick=home;
  document.getElementById('go').onclick=function(){
    var num=+document.getElementById('num').value,nm=document.getElementById('nm').value.trim(),sv=document.getElementById('st').value,st=+sv;
    if(!c||!num||!nm||sv===''||isNaN(st)){document.getElementById('err').innerHTML='<div class="warn">반, 번호, 이름, 처음 가진 돈을 모두 적어 주세요.</div>';return;}
    S.p={grade:g,cls:c,num:num,name:nm,start:st};save();main();
  };
}

function header(){
  return '<button class="mini noprint" id="gohome">🏠 처음 화면으로</button><div class="card top" style="margin-top:6px"><div class="who">'+S.p.grade+'학년 '+S.p.cls+'반 '+S.p.num+'번<br><b>'+esc(S.p.name)+'</b></div><div class="pig" id="pig" role="button" tabindex="0" aria-label="내 정보 고치기"><span style="font-size:34px">🐷</span><div><small>지금 내 돈 ✏️</small><div class="big">'+won(leftNow())+'</div></div></div></div>'+
  '<nav class="noprint"><button data-t="sell" class="'+(S.tab==='sell'?'on':'')+'">🏷️ 판매</button><button data-t="buy" class="'+(S.tab==='buy'?'on':'')+'">🧾 구매</button><button data-t="sum" class="'+(S.tab==='sum'?'on':'')+'">⭐ 정리</button></nav>';
}

function sellSec(){
  var ph=S.phase||'prep';
  var h='<section class="sec card'+(S.tab==='sell'?' on':'')+'"><h2>🏷️ 판매 가격표</h2><div class="seg noprint">'+[['prep','① 판매준비'],['selling','② 판매중'],['done','③ 판매종료']].map(function(a){return '<button class="'+(ph===a[0]?'on':'')+'" data-ph="'+a[0]+'">'+a[1]+'</button>';}).join('')+'</div>';
  if(ph!=='done')h+='<label>물건 이름</label><input id="sn" placeholder="예: 연필 세트" maxlength="20"><div class="row"><div><label>가격 (원)</label><input id="sp" type="number" inputmode="numeric" min="0" step="100" placeholder="500"></div><div><label>팔 개수</label><input id="sq" type="number" inputmode="numeric" min="1" value="1"></div></div><button class="btn b-coral" id="addS">➕ 가격표 만들기</button>';
  if(ph==='selling')h+='<div class="msg">💰 지금까지 번 돈 <b>'+won(totalS())+'</b></div>';
  if(ph==='done'){var p=pct();h+='<div class="ring" style="--p:'+p+'"><div><b>'+p+'%</b><small>판매했어요</small></div></div><div class="msg">준비한 '+stockN()+'개 중 '+soldN()+'개를 팔아서 '+won(totalS())+'을 벌었어요!<br>'+(p>=100?'모두 팔았어요! 대단해요 🎉':p>=70?'정말 잘 팔았어요 👏':p>=40?'절반 넘게 팔았어요 😊':'다음엔 더 많이 팔 수 있을 거예요 💪')+'</div>';}
  if(!S.sells.length)h+='<div class="empty">아직 가격표가 없어요.<br>위에서 첫 가격표를 만들어 보세요!</div>';

function push(){var r={grade:S.p.grade,cls:S.p.cls,num:S.p.num,name:S.p.name,start:S.p.start,sold:soldN(),stock:stockN(),earn:totalS(),spent:totalB(),left:leftNow(),phase:S.phase||'prep',submittedAt:S.submitted||Date.now(),sellsL:S.sells,buysL:S.buys,eS:S.eS,eB:S.eB};return DB.collection('records').doc(UID).set(r);}
function submit(){

  {e:'🏷️',t:'가격 붙이기',s:'네 번째! 손님이 가격을 한눈에 알아볼 수 있어야 해.',d:'각 물품에 가격이 붙어있나요?'},
  {e:'✨',t:'깨끗하게 손질하기',s:'다섯 번째! 반짝반짝한 물건은 손님의 눈길을 끈단다.',d:'누구나 사고 싶은 마음이 생기도록 깨끗하게 손질되어있나요?'},
  {e:'⚠️',t:'위험한 물건',s:'여섯 번째! 모두가 안전해야 즐거운 시장이야.',d:'위험한 물건이나 장난감을 가져오지는 않았나요? (총, 칼모양의 장난감 등)'},
  {e:'🎲',t:'운에 맡기는 물건',s:'일곱 번째! 운에 맡기는 놀이는 시장에 어울리지 않아.',d:'뽑기나 복불복처럼 운에 맡기게 되는 물건을 가져오지는 않았나요?'},

      INTRO_ON=false;seen=true;if(S.p)main();else setup();window.scrollTo(0,0);
    };
  }
  draw();
}
